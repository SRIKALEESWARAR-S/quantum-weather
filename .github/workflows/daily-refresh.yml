name: Refresh Cosmic Circuit Daily

on:
  workflow_dispatch:
  schedule:
    # Daily at 01:20 UTC (06:50 India Standard Time).
    - cron: '20 1 * * *'

permissions:
  contents: write

concurrency:
  group: cosmic-circuit-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Test data helpers
        run: pytest -q
      - name: Fetch and process daily data
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          WEATHER_CITY: ${{ vars.WEATHER_CITY }}
          WEATHER_LATITUDE: ${{ vars.WEATHER_LATITUDE }}
          WEATHER_LONGITUDE: ${{ vars.WEATHER_LONGITUDE }}
        run: python update.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh daily science data [skip ci]"
            git push
          fi
